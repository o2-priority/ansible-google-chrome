---

- name: Add google-chrome gpg signing key
  apt_key:
    url:   "{{ google_chrome_signing_key_url }}"
    state: present

- name: Add google-chrome apt repo to sources list
  template: 
    src:  google-chrome.list.j2
    dest: /etc/apt/sources.list.d/google-chrome.list
    mode: 0644
  register: repo

- name: Update apt repo cache for google-chrome
  apt:  update_cache=yes
  when: repo|changed

- name: Download google_chrome_version
  get_url:
    url: https://mirror.cs.uchicago.edu/google-chrome/pool/main/g/google-chrome-stable/_{{ google_chrome_version }}-1_amd64.deb
    dest: /opt/google-chrome-stable_{{ google_chrome_version }}-1_amd64.deb
    mode: 0755

- name: Check if google-chrome is installed
  shell: >
      dpkg -s google-chrome-stable | grep 'install ok installed'
  register: pkg_deb
  ignore_errors: yes
  when: ansible_os_family|lower == 'debian'

- name: Install google chrome
  shell: >
      dpkg -i /opt/google-chrome-stable_{{ google_chrome_version }}-1_amd64.deb
  when: "(pkg_deb.rc is defined and pkg_deb.rc == 1)"

